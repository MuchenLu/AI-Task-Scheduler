[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schedai"
version = "0.1.0"
description = "這是一個採用 MVC 架構開發的 AI 自動排任務系統"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # === Google AI & Calendar API ===
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-generativeai",
    "python-dotenv",

    # === GUI ===
    "PyQt6",
    "keyboard",

    # === Voice ===
    "openai-whisper",
    "PyAudio",
    "pydub",

    # === Utils ===
    "pytz",
    "python-dateutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyinstaller",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "views*", "controllers*"]
namespaces = false